name: Release

on:
  # A v* tag push publishes (a release cut in the GitHub UI pushes its tag).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or sha to release"
        required: false
        default: ""
      version:
        description: "Stamp this version before building (nightlies pass X.Y.Z.devN)"
        required: false
        default: ""
      publish:
        description: "Upload to PyPI and GitHub (off: build and smoke-test only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

# The only workflow that builds or uploads, so PyPI needs one trusted
# publisher: this file, environment `pypi`.
jobs:
  # On the project's build machine (self-hosted, Docker), in the image of
  # packaging/ci/Dockerfile. Started by tag pushes and dispatches only.
  build:
    name: Build the wheel
    runs-on: [self-hosted, linux, x64, kohaku-build]
    timeout-minutes: 350
    env:
      # Build container limits; the runner's environment sets KTT_CI_CACHE, the
      # host directory of the persistent caches (tt-metal build, ccache, uv).
      KTT_CI_CPUS: "48"
      KTT_CI_MEMORY: "64g"
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Build image
        run: bash packaging/ci/docker.sh image

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ci="bash packaging/ci/docker.sh run"
          if [ -n "${{ inputs.version }}" ]; then
            ${ci} python3 scripts/ci/version.py write "${{ inputs.version }}"
          fi
          version=$(${ci} python3 scripts/ci/version.py read)
          case "${version}" in
            *dev*|*a*|*b*|*rc*) pre=true ;;
            *) pre=false ;;
          esac
          {
            echo "version=${version}"
            echo "prerelease=${pre}"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${version} (prerelease=${pre})"

      # A tag that disagrees with pyproject is a mis-cut release: stop before
      # anything is uploaded, since a PyPI filename cannot be reused.
      - name: Tag must match pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "${tag}" = "${{ steps.version.outputs.version }}" \
            || { echo "tag ${tag} != pyproject ${{ steps.version.outputs.version }}"; exit 1; }

      # tt-metal at the pin (built once per pin and build script, kept in the
      # cache), the native library per supported torch, the repaired wheel, and
      # an import of it under each torch (no card on the runner).
      - name: Build and smoke-test the wheel
        run: bash packaging/ci/docker.sh run bash packaging/ci/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kohakutt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish the GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"
          tag="v${version}"
          flag=""
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            flag="--prerelease"
          fi
          notes=$(python scripts/ci/release_notes.py --version "${version}")
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "Kohaku-TT ${version}" \
              --notes "${notes}" ${flag} --target "$(git rev-parse HEAD)"
          else
            gh release edit "${tag}" --title "Kohaku-TT ${version}" \
              --notes "${notes}" ${flag}
          fi
          for f in dist/*; do gh release upload "${tag}" "$f" --clobber; done
